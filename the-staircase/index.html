<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Staircase</title>
<style>
  :root {
    --bg: #0b0a09;
    --bar: rgba(11, 10, 9, 0.72);
    --fg: #d9d1bf;
    --muted: #8a8172;
    --track: #3a352e;
    --accent: #c98f45;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  #film { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; max-width: 100%; background: #000; cursor: pointer; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px;
    padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(transparent, var(--bar) 45%); transition: opacity .5s ease; }
  #ui.hide { opacity: 0; }
  #ui.hide:focus-within { opacity: 1; }
  button { appearance: none; border: 0; background: none; color: var(--fg); padding: 6px; border-radius: 4px; cursor: pointer; display: grid; place-items: center; }
  button:hover { color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #play svg .pause { display: none; }
  #play[data-state="playing"] svg .pause { display: block; }
  #play[data-state="playing"] svg .play { display: none; }
  #scrub { flex: 1; min-width: 0; accent-color: var(--accent); height: 4px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
  @media (max-width: 480px) { #time { display: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" width="1920" height="1080" aria-label="The Staircase, an animated short in four scenes"></canvas>
</div>
<div id="ui">
  <button id="play" type="button" aria-label="Pause" data-state="playing">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path class="play" d="M5 3.5v13l11-6.5z"/>
      <g class="pause"><rect x="4.5" y="3.5" width="4" height="13"/><rect x="11.5" y="3.5" width="4" height="13"/></g>
    </svg>
  </button>
  <input id="scrub" type="range" min="0" max="45" step="0.01" value="0" aria-label="Seek">
  <span id="time">0:00 / 0:45</span>
  <button id="full" type="button" aria-label="Full screen">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>
  </button>
</div>
<script src="film.js"></script>
</body>
</html>
