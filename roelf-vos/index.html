<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>The Story of Roelf Vos</title>
    <script src="js/vendor/gsap.min.js"></script>
    <script src="js/vendor/d3-array.min.js"></script>
    <script src="js/vendor/d3-geo.min.js"></script>
    <script src="js/data/script-font.js"></script>
    <script src="js/data/world.js"></script>
    <script src="js/data/tasmania.js"></script>
    <script src="js/timing.js"></script>
    <script src="js/lib.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 500; src: url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 600; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 600; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); }
      @font-face { font-family: "Josefin Sans"; font-style: normal; font-weight: 300; src: url("assets/fonts/josefin-sans-latin-300-normal.woff2") format("woff2"); }
      @font-face { font-family: "Josefin Sans"; font-style: normal; font-weight: 400; src: url("assets/fonts/josefin-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Josefin Sans"; font-style: normal; font-weight: 600; src: url("assets/fonts/josefin-sans-latin-600-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1a1012; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1a1012; }
      .clip { position: absolute; inset: 0; }
      .scene { overflow: hidden; }
      .frame { position: absolute; inset: 0; overflow: hidden; will-change: transform, clip-path; }
      .art { position: absolute; inset: 0; display: block; }
      .hud { position: absolute; inset: 0; pointer-events: none; }
      .label {
        position: absolute; font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 26px;
        letter-spacing: 0.42em; text-transform: uppercase; color: #f6ead3; white-space: nowrap;
      }
      .caption { display: flex; align-items: flex-end; justify-content: center; padding: 0 220px 84px; pointer-events: none; }
      .cap-text {
        display: block; max-width: 1480px; text-align: center; font-family: "Cormorant Garamond", serif; font-style: italic;
        font-weight: 600; font-size: 54px; line-height: 1.18; color: #fff8ec; letter-spacing: 0.005em;
        text-shadow: 0 2px 3px rgba(20, 8, 6, 0.55), 0 0 26px rgba(20, 8, 6, 0.55), 0 0 60px rgba(20, 8, 6, 0.35);
      }
      .cap-text .w { display: inline-block; will-change: transform, opacity, filter; }
      #vignette {
        background:
          radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(14, 6, 6, 0.42) 100%);
        pointer-events: none;
      }
      #grain { pointer-events: none; mix-blend-mode: overlay; opacity: 0.16; background-repeat: repeat; background-size: 256px 256px; }
      #fade { background: #0d0809; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="118" data-width="1920" data-height="1080">
      <!-- Scenes: one clip per story beat, on the 100 BPM bar grid in js/timing.js -->
      <section id="sc-title" class="clip scene" data-start="0" data-duration="7.8" data-track-index="1"></section>
      <section id="sc-holland" class="clip scene" data-start="6.4" data-duration="8.6" data-track-index="2"></section>
      <section id="sc-war" class="clip scene" data-start="13.6" data-duration="11" data-track-index="1"></section>
      <section id="sc-voyage" class="clip scene" data-start="23.2" data-duration="11" data-track-index="2"></section>
      <section id="sc-arrival" class="clip scene" data-start="32.8" data-duration="11" data-track-index="1"></section>
      <section id="sc-markets" class="clip scene" data-start="42.4" data-duration="8.6" data-track-index="2"></section>
      <section id="sc-swiss" class="clip scene" data-start="49.6" data-duration="11" data-track-index="1"></section>
      <section id="sc-build" class="clip scene" data-start="59.2" data-duration="11" data-track-index="2"></section>
      <section id="sc-money" class="clip scene" data-start="68.8" data-duration="8.6" data-track-index="1"></section>
      <section id="sc-rules" class="clip scene" data-start="76" data-duration="8.6" data-track-index="2"></section>
      <section id="sc-complete" class="clip scene" data-start="83.2" data-duration="8.6" data-track-index="1"></section>
      <section id="sc-rare" class="clip scene" data-start="90.4" data-duration="8.6" data-track-index="2"></section>
      <section id="sc-snow" class="clip scene" data-start="97.6" data-duration="11" data-track-index="1"></section>
      <section id="sc-end" class="clip scene" data-start="107.2" data-duration="10.8" data-track-index="2"></section>

      <!-- Finish: vignette, film grain -->
      <div id="vignette" class="clip" data-start="0" data-duration="118" data-track-index="20"></div>

      
      <div id="grain" class="clip" data-start="0" data-duration="118" data-track-index="40"></div>
      <div id="fade" class="clip" data-start="0" data-duration="118" data-track-index="41"></div>

      <!-- Original score, composed in Python: music/compose.py -->
      <audio id="score" src="assets/audio/score.m4a" data-start="0" data-duration="118" data-track-index="50" data-volume="1"></audio>
    </div>

    <script src="js/scenes/01-title.js"></script>
    <script src="js/scenes/02-holland.js"></script>
    <script src="js/scenes/03-war.js"></script>
    <script src="js/scenes/04-voyage.js"></script>
    <script src="js/scenes/05-arrival.js"></script>
    <script src="js/scenes/06-markets.js"></script>
    <script src="js/scenes/07-swiss.js"></script>
    <script src="js/scenes/08-build.js"></script>
    <script src="js/scenes/09-money.js"></script>
    <script src="js/scenes/10-rules.js"></script>
    <script src="js/scenes/11-complete.js"></script>
    <script src="js/scenes/12-rare.js"></script>
    <script src="js/scenes/13-snow.js"></script>
    <script src="js/scenes/14-end.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        RV.SCENES.forEach(([id]) => {
          const build = RV.scene && RV.scene[id];
          if (build) build(tl, RV.stage(id));
        });
        // film grain: a static noise tile, re-seated three times a second so it "boils" gently
        // (refreshing it every frame looks the same but makes the encode several times larger)
        const grain = document.getElementById("grain");
        grain.style.backgroundImage = "url(" + RV.grainTexture() + ")";
        const gp = { k: 0 };
        tl.fromTo(gp, { k: 0 }, {
          k: 354, duration: 118, ease: "none",
          onUpdate: () => {
            const k = Math.floor(gp.k);
            grain.style.backgroundPosition = ((k * 97) % 256) + "px " + ((k * 61) % 256) + "px";
          },
        }, 0);
        // fade up from black and down to black
        const fade = document.getElementById("fade");
        tl.fromTo(fade, { opacity: 1 }, { opacity: 0, duration: 1.2, ease: "sine.out" }, 0);
        tl.fromTo(fade, { opacity: 0 }, { opacity: 1, duration: 2.6, ease: "sine.inOut", immediateRender: false }, 115.2);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
